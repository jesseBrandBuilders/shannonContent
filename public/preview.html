const STATUS_VARIANT = {
  draft: 'bg-stone-100 text-stone-700',

  published: 'bg-emerald-50 text-emerald-700',

// ============================================================
// Router
// ============================================================
let currentRoute = 'dashboard';
let composerPostId = null;

function navigate(route, postId = null) {
  currentRoute = route;
  composerPostId = postId;
  render();
  window.scrollTo(0, 0);
}

// ============================================================
// Icons (inline SVG so no dependency)
// ============================================================

  search: icon('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'),

  chevron_right: icon('<path d="m9 18 6-6-6-6"/>'),

  target: icon('<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>'),

// ============================================================
// Layout shell
// ============================================================
function Shell(content) {
  const navItems = [
    { route: 'dashboard', icon: ICONS.dashboard, label: 'Dashboard' },
    { route: 'composer', icon: ICONS.pen, label: 'Composer' },
    { route: 'library', icon: ICONS.library, label: 'Library' },
    { route: 'calendar', icon: ICONS.calendar, label: 'Calendar' },
    { route: 'templates', icon: ICONS.template, label: 'Templates' },
    { route: 'analytics', icon: ICONS.chart, label: 'Analytics' }
  ];

  const sidebarItems = navItems.map(i => `
    <button onclick="navigate('${i.route}')" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors ${currentRoute === i.route ? 'bg-indigo-50 text-indigo-700' : 'text-stone-600 hover:bg-stone-100 hover:text-stone-900'}">
      ${i.icon}
      ${i.label}
    </button>
  `).join('');

  const bottomNavItems = navItems.slice(0, 5).map(i => `
    <button onclick="navigate('${i.route}')" class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-lg transition-colors ${currentRoute === i.route ? 'text-indigo-600' : 'text-stone-500'}">
      ${i.icon.replace('w-4 h-4', 'w-5 h-5')}

    </button>
  `).join('');

  return `
    <div class="min-h-screen bg-stone-50 flex">
      <aside class="hidden md:flex w-64 flex-col border-r border-stone-200/80 bg-white/80 backdrop-blur-xl sticky top-0 h-screen">
        <div class="px-6 py-6">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white">

        <div class="px-3 py-4 border-t border-stone-100">
          <div class="flex items-center gap-3 px-3 py-2">
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-indigo-700 flex items-center justify-center text-white text-sm font-semibold">S</div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-stone-900 truncate">shannon@example.com</p>
            </div>
            <button class="p-1.5 rounded-lg hover:bg-stone-100 text-stone-500">${ICONS.logout}</button>
          </div>
        </div>
      </aside>

      <main class="flex-1 flex flex-col min-w-0">
        <div class="md:hidden sticky top-0 z-30 bg-white/90 backdrop-blur-xl border-b border-stone-200/80 px-4 py-3 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 bg-indigo-600 rounded-lg flex items-center justify-center text-white">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
            </div>
            <h1 class="text-sm font-semibold text-stone-900 tracking-tight">Content Studio</h1>
          </div>
        </div>
        <div class="flex-1 pb-20 md:pb-0">${content}</div>
        <nav class="md:hidden fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur-xl border-t border-stone-200/80 px-2 py-2">
          <div class="flex items-center justify-around">${bottomNavItems}</div>

}

// ============================================================
// Reusable bits
// ============================================================
function PageHeader(title, subtitle, action = '') {
  return `
    <div class="px-4 md:px-8 pt-6 md:pt-10 pb-4 md:pb-6 flex items-end justify-between gap-4 flex-wrap">
      <div>
        <h1 class="text-2xl md:text-3xl font-semibold text-stone-900 tracking-tighter">${title}</h1>
        ${subtitle ? `<p class="mt-1 text-sm text-stone-500">${subtitle}</p>` : ''}
      </div>
      ${action ? `<div>${action}</div>` : ''}
    </div>
  `;
}

function Card(content, className = '') {
  return `<div class="bg-white border border-stone-200/80 rounded-2xl shadow-sm ${className}">${content}</div>`;
}

function Badge(text, variant = 'default') {
  const cls = STATUS_VARIANT[variant] || STATUS_VARIANT.draft;
  return `<span class="inline-flex items-center px-2 py-0.5 text-xs font-medium rounded-md ${cls}">${text}</span>`;
}

function PrimaryButton(text, iconKey, onclick = '') {
  return `<button onclick="${onclick}" class="inline-flex items-center justify-center gap-2 font-medium rounded-xl bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm transition-all px-4 py-2 text-sm">${iconKey ? ICONS[iconKey] : ''}${text}</button>`;
}

function SecondaryButton(text, iconKey, onclick = '') {
  return `<button onclick="${onclick}" class="inline-flex items-center justify-center gap-2 font-medium rounded-xl bg-white text-stone-900 border border-stone-200 hover:bg-stone-50 transition-all px-4 py-2 text-sm">${iconKey ? ICONS[iconKey] : ''}${text}</button>`;
}

// ============================================================
// Pages
// ============================================================
function Dashboard() {
  const drafts = SAMPLE_POSTS.filter(p => p.status === 'draft').length;
  const scheduled = SAMPLE_POSTS.filter(p => p.status === 'scheduled').length;
  const published = SAMPLE_POSTS.filter(p => p.status === 'published').length;
  const ratedPosts = SAMPLE_POSTS.filter(p => p.ratings?.length);
  const avgRating = ratedPosts.length
    ? (ratedPosts.reduce((a, p) => a + p.ratings[0].engagement_score, 0) / ratedPosts.length).toFixed(1)
    : '—';

  const stats = [
    { label: 'Drafts', value: drafts, iconKey: 'file_text', color: 'text-stone-600 bg-stone-50' },
    { label: 'Scheduled', value: scheduled, iconKey: 'calendar', color: 'text-amber-600 bg-amber-50' },
    { label: 'Published', value: published, iconKey: 'trending', color: 'text-emerald-600 bg-emerald-50' },
    { label: 'Avg Rating', value: avgRating, iconKey: 'sparkles', color: 'text-indigo-600 bg-indigo-50' }
  ];

  const statCards = stats.map(s => Card(`
    <div class="p-4 md:p-5">
      <div class="w-9 h-9 rounded-lg ${s.color} flex items-center justify-center mb-3">${ICONS[s.iconKey]}</div>
      <div class="text-2xl font-semibold text-stone-900 tracking-tight">${s.value}</div>
      <div class="text-xs text-stone-500 mt-0.5">${s.label}</div>
    </div>
  `)).join('');

  const recentRows = SAMPLE_POSTS.slice(0, 5).map(p => `
    <li>
      <button onclick="navigate('composer', '${p.id}')" class="w-full text-left block px-5 py-4 hover:bg-stone-50 transition-colors">
        <div class="flex items-start gap-4">
          <div class="flex-1 min-w-0">
            <p class="text-sm text-stone-900 line-clamp-2">${p.content || '<span class="text-stone-400 italic">Untitled draft</span>'}</p>
            <div class="mt-2 flex items-center gap-2 text-xs text-stone-500">
              ${Badge(p.status, p.status)}
              ${p.eos_category ? Badge(p.eos_category, 'indigo') : ''}
              <span>${p.created_at}</span>
            </div>
          </div>
          <span class="text-stone-400 flex-shrink-0 mt-1">${ICONS.arrow_up_right}</span>
        </div>
      </button>
    </li>
  `).join('');

  return `
    ${PageHeader('Welcome back, Shannon', "Here's what's happening with your content.", PrimaryButton('New Post', 'pen', "navigate('composer')"))}
    <div class="px-4 md:px-8 pb-8 space-y-6">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">${statCards}</div>
      ${Card(`
        <div class="px-5 py-4 border-b border-stone-100 flex items-center justify-between">
          <h2 class="text-base font-semibold text-stone-900 tracking-tight">Recent Posts</h2>
          <button onclick="navigate('library')" class="text-sm text-indigo-600 hover:text-indigo-700 font-medium flex items-center gap-1">View all ${ICONS.arrow_up_right.replace('w-4 h-4', 'w-3.5 h-3.5')}</button>
        </div>
        <ul class="divide-y divide-stone-100">${recentRows}</ul>
      `, 'overflow-hidden')}
    </div>
  `;
}

function Composer() {
  const post = composerPostId ? SAMPLE_POSTS.find(p => p.id === composerPostId) : null;
  const content = post?.content || '';
  const charCount = content.length;
  const charPercent = (charCount / 3000) * 100;

  return `
    ${PageHeader(post ? 'Edit Post' : 'New Post', 'Compose, refine, and publish to LinkedIn.', `
      <div class="flex items-center gap-2">
        ${post ? `<button class="p-2 rounded-lg hover:bg-stone-100 text-stone-700">${ICONS.trash}</button>` : ''}
        ${SecondaryButton('Save', 'save')}
        ${PrimaryButton('Publish', 'send')}
      </div>
    `)}
    <div class="px-4 md:px-8 pb-8 grid lg:grid-cols-[1fr_320px] gap-6">
      <div class="space-y-4">
        ${Card(`
          <div class="p-5">
            <div class="flex items-center justify-between mb-3">
              <select class="text-xs font-medium bg-indigo-50 text-indigo-700 border-0 rounded-md px-2 py-1">
                <option>${post?.eos_category || 'general'}</option>
              </select>
              <button class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium bg-gradient-to-r from-indigo-50 to-purple-50 text-indigo-700 rounded-lg hover:from-indigo-100 hover:to-purple-100">
                ${ICONS.wand.replace('w-4 h-4', 'w-3.5 h-3.5')} AI Assist
              </button>
            </div>
            <textarea rows="18" class="w-full text-base leading-relaxed border-0 focus:ring-0 p-0 resize-none focus:outline-none placeholder:text-stone-400" placeholder="Start writing, or use AI Assist to generate a draft based on an EOS topic…">${content}</textarea>
            <div class="mt-4 pt-4 border-t border-stone-100 flex items-center justify-between">
              <div class="flex items-center gap-2 text-xs text-stone-500">
                <span>${charCount} / 3000</span>
                <div class="w-24 h-1 bg-stone-100 rounded-full overflow-hidden">
                  <div class="h-full bg-emerald-500" style="width: ${Math.min(charPercent, 100)}%"></div>
                </div>
              </div>
            </div>
          </div>
        `)}
      </div>
      <div class="space-y-4">
        ${Card(`
          <div class="p-5">
            <h3 class="text-sm font-semibold text-stone-900 mb-3 flex items-center gap-1.5">${ICONS.sparkles.replace('w-4 h-4', 'w-3.5 h-3.5')} Tips</h3>
            <ul class="space-y-2 text-sm text-stone-600">
              <li class="flex gap-2"><span class="text-indigo-600">•</span> Open with a hook in the first 2 lines (the "see more" cutoff).</li>
              <li class="flex gap-2"><span class="text-indigo-600">•</span> Use whitespace generously — short lines read better on mobile.</li>
              <li class="flex gap-2"><span class="text-indigo-600">•</span> End with a question to drive comments.</li>
              <li class="flex gap-2"><span class="text-indigo-600">•</span> 3-5 hashtags is the sweet spot.</li>
            </ul>
          </div>
        `)}
      </div>
    </div>
  `;
}

function Library() {
  const filterPills = ['All', 'Drafts', 'Scheduled', 'Published'].map((label, i) => `
    <button class="px-3 py-1.5 text-sm font-medium rounded-lg whitespace-nowrap transition-colors ${i === 0 ? 'bg-indigo-50 text-indigo-700' : 'text-stone-600 hover:bg-stone-50'}">${label}</button>
  `).join('');

  const cards = SAMPLE_POSTS.map(p => `
    <button onclick="navigate('composer', '${p.id}')" class="w-full text-left">
      ${Card(`
        <div class="p-5">
          <div class="flex items-start justify-between gap-4 mb-3">
            <div class="flex items-center gap-2 flex-wrap">
              ${Badge(p.status, p.status)}
              ${p.eos_category ? Badge(p.eos_category, 'indigo') : ''}
            </div>
            <span class="text-xs text-stone-500 flex-shrink-0">${p.created_at}</span>
          </div>
          <p class="text-sm text-stone-700 line-clamp-3 leading-relaxed">${p.content || '<span class="text-stone-400 italic">Untitled draft</span>'}</p>
        </div>
      `, 'hover:border-stone-300 hover:shadow-md transition-all cursor-pointer')}
    </button>
  `).join('');

  return `
    ${PageHeader('Library', `${SAMPLE_POSTS.length} posts`, PrimaryButton('New Post', 'pen', "navigate('composer')"))}
    <div class="px-4 md:px-8 pb-8 space-y-4">
      <div class="flex flex-col md:flex-row gap-3">
        <div class="relative flex-1">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400">${ICONS.search}</span>
          <input type="search" placeholder="Search posts…" class="w-full px-3.5 py-2.5 pl-9 bg-white border border-stone-200 rounded-xl text-stone-900 placeholder:text-stone-400 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div class="flex gap-1 bg-white border border-stone-200 rounded-xl p-1 overflow-x-auto">${filterPills}</div>
      </div>
      <div class="grid gap-3">${cards}</div>
    </div>
  `;
}

function CalendarPage() {
  // Simple calendar grid for April 2026
  const days = [];
  // April 1, 2026 is a Wednesday (day 3)
  for (let i = 0; i < 42; i++) {
    const dayNum = i - 2; // Wed = 3, so April 1 starts on index 3
    const inMonth = dayNum >= 1 && dayNum <= 30;
    const isToday = dayNum === 25;
    const dayPosts = SAMPLE_POSTS.filter(p => {
      const date = p.scheduled_at || p.published_at || p.created_at;
      return date && parseInt(date.split('-')[2]) === dayNum;
    });
    days.push({ dayNum, inMonth, isToday, posts: dayPosts });
  }

  const dayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
    .map(d => `<div class="px-2 py-2 text-xs font-medium text-stone-500 text-center">${d}</div>`).join('');

  const dayCells = days.map(d => `
    <div class="min-h-[80px] md:min-h-[100px] border-r border-b border-stone-100 p-1.5 md:p-2 ${!d.inMonth ? 'bg-stone-50/50' : 'bg-white'}">
      <div class="${d.isToday ? 'inline-flex items-center justify-center w-5 h-5 bg-indigo-600 text-white rounded-full text-xs font-medium' : `text-xs font-medium ${d.inMonth ? 'text-stone-700' : 'text-stone-400'}`}">${d.inMonth ? d.dayNum : ''}</div>
      <div class="space-y-1 mt-1">
        ${d.posts.slice(0, 2).map(p => {
          const cls = p.status === 'scheduled' ? 'bg-amber-100 text-amber-800' : p.status === 'published' ? 'bg-emerald-100 text-emerald-800' : 'bg-stone-100 text-stone-700';
          return `<button onclick="navigate('composer', '${p.id}')" class="block w-full text-left px-1.5 py-0.5 text-[10px] md:text-xs rounded truncate ${cls}">${(p.content || 'Draft').slice(0, 30)}</button>`;
        }).join('')}
      </div>
    </div>
  `).join('');

  return `
    ${PageHeader('Calendar', 'Schedule and visualize your posting cadence.', PrimaryButton('New Post', 'pen', "navigate('composer')"))}
    <div class="px-4 md:px-8 pb-8">
      ${Card(`
        <div class="px-5 py-4 border-b border-stone-100 flex items-center justify-between">
          <h2 class="text-base font-semibold text-stone-900 tracking-tight">April 2026</h2>
          <div class="flex items-center gap-1">
            <button class="p-1.5 rounded-lg hover:bg-stone-100 text-stone-600">${ICONS.chevron_left}</button>
            <button class="px-3 py-1 text-sm font-medium text-stone-700 hover:bg-stone-100 rounded-lg">Today</button>
            <button class="p-1.5 rounded-lg hover:bg-stone-100 text-stone-600">${ICONS.chevron_right}</button>
          </div>
        </div>
        <div class="grid grid-cols-7 border-b border-stone-100">${dayLabels}</div>
        <div class="grid grid-cols-7">${dayCells}</div>
      `, 'overflow-hidden')}
    </div>
  `;
}

function Templates() {
  const templates = [
    { iconKey: 'layers', color: 'bg-blue-50 text-blue-700', name: 'Level 10 Meeting Insight', cat: 'level10', desc: 'Share a recurring tension you noticed in L10s and how to break it.' },
    { iconKey: 'target', color: 'bg-emerald-50 text-emerald-700', name: 'Quarterly Rocks Reflection', cat: 'rocks', desc: 'Reflect on a Rock that succeeded — or failed — and what it taught you.' },
    { iconKey: 'compass', color: 'bg-purple-50 text-purple-700', name: 'V/TO Clarity Story', cat: 'vto', desc: 'Tell the story of how a leadership team got crystal clear on Vision.' },
    { iconKey: 'users', color: 'bg-amber-50 text-amber-700', name: 'GWC People Lesson', cat: 'people', desc: 'A story about a Right Person / Wrong Seat moment.' },
    { iconKey: 'workflow', color: 'bg-pink-50 text-pink-700', name: 'Process Component Win', cat: 'process', desc: "Document a process that 10x'd a part of the business." },
    { iconKey: 'trending', color: 'bg-indigo-50 text-indigo-700', name: 'Traction Milestone', cat: 'traction', desc: 'Celebrate a Traction milestone with the lessons that got you there.' }
  ];

  const cards = templates.map(t => Card(`
    <div class="p-5 flex flex-col h-full">
      <div class="w-10 h-10 rounded-xl ${t.color} flex items-center justify-center mb-4">${ICONS[t.iconKey].replace('w-4 h-4', 'w-5 h-5')}</div>
      <h3 class="text-base font-semibold text-stone-900 tracking-tight">${t.name}</h3>
      <p class="mt-1 text-sm text-stone-500 leading-relaxed flex-1">${t.desc}</p>
      <div class="mt-4 flex items-center justify-between">
        ${Badge(t.cat, 'indigo')}
        <button onclick="navigate('composer')" class="text-sm font-medium text-indigo-600 hover:text-indigo-700">Use template →</button>
      </div>
    </div>
  `, 'hover:border-stone-300 hover:shadow-md transition-all')).join('');

  return `
    ${PageHeader('Templates', 'EOS-specific starting points for common post types.')}
    <div class="px-4 md:px-8 pb-8 grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${cards}</div>
  `;
}

function Analytics() {
  const ratedPosts = SAMPLE_POSTS.filter(p => p.ratings?.length);
  const avgEng = (ratedPosts.reduce((a, p) => a + p.ratings[0].engagement_score, 0) / ratedPosts.length).toFixed(1);
  const avgRes = (ratedPosts.reduce((a, p) => a + p.ratings[0].resonance_score, 0) / ratedPosts.length).toFixed(1);

  const overviewCards = [
    { label: 'Avg Engagement', value: avgEng, color: 'bg-amber-50 text-amber-600', iconKey: 'star' },
    { label: 'Avg Resonance', value: avgRes, color: 'bg-rose-50 text-rose-600', iconKey: 'award' },
    { label: 'Rated Posts', value: ratedPosts.length, color: 'bg-emerald-50 text-emerald-600', iconKey: 'trending' }
  ].map(s => Card(`
    <div class="p-5 flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl ${s.color} flex items-center justify-center">${ICONS[s.iconKey].replace('w-4 h-4', 'w-5 h-5')}</div>
      <div>
        <div class="text-2xl font-semibold text-stone-900">${s.value}</div>
        <div class="text-xs text-stone-500">${s.label}</div>
      </div>
    </div>
  `)).join('');

  const publishedRows = SAMPLE_POSTS.filter(p => p.status === 'published').map(p => {
    const rating = p.ratings?.[0];
    const avg = rating ? ((rating.engagement_score + rating.resonance_score) / 2).toFixed(1) : null;
    return `
      <li class="px-5 py-4">
        <div class="flex items-start gap-4">
          <div class="flex-1 min-w-0">
            <p class="text-sm text-stone-700 line-clamp-2">${p.content}</p>
            <div class="mt-2 flex items-center gap-2 flex-wrap">
              ${Badge(p.eos_category, 'indigo')}
              <span class="text-xs text-stone-500">${p.published_at}</span>
              ${avg ? `<div class="flex items-center gap-1"><span class="text-amber-400">${ICONS.star.replace('w-4 h-4', 'w-3.5 h-3.5').replace('fill="none"', 'fill="currentColor"')}</span><span class="text-xs text-stone-600">${avg}</span></div>` : ''}
            </div>
          </div>
          ${SecondaryButton(rating ? 'Edit rating' : 'Rate')}
        </div>
      </li>
    `;
  }).join('');

  return `
    ${PageHeader('Analytics', 'Rate your published posts to learn what resonates.')}
    <div class="px-4 md:px-8 pb-8 space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">${overviewCards}</div>
      ${Card(`
        <div class="px-5 py-4 border-b border-stone-100">
          <h2 class="text-base font-semibold text-stone-900 tracking-tight">All published posts</h2>
        </div>
        <ul class="divide-y divide-stone-100">${publishedRows}</ul>
      `, 'overflow-hidden')}
    </div>
  `;
}

// ============================================================
// Render
// ============================================================
function render() {
  const pages = {
    dashboard: Dashboard,
    composer: Composer,
    library: Library,
    calendar: CalendarPage,
    templates: Templates,
    analytics: Analytics
  };
  document.getElementById('app').innerHTML = Shell(pages[currentRoute]());
}

render();
</script>
</body>
</html>
